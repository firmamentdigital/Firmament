# nginx — publica o Silas 10 em https://silas10.wmorente.com.br
# Copiar para /etc/nginx/sites-available/silas10.wmorente.com.br.conf,
# ativar com um link em sites-enabled e depois rodar o certbot (ver IMPLANTACAO-VPS.md).
# O certbot adiciona sozinho o bloco HTTPS (porta 443) e o redirecionamento de HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name silas10.wmorente.com.br;

    # Logomarcas até 2 MB e imagens de avisos até 5 MB.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IP real do visitante (usado no limite de tentativas de login).
        # O nginx sobrescreve qualquer valor enviado pelo navegador.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Cabeçalhos de identidade do ChatGPT Sites não têm valor aqui: descartados.
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";

        proxy_read_timeout 60s;
    }
}
